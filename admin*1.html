<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>管理頁｜課程資料卡</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f8;--card:#fff;--ink:#17294d;--sub:#5b6b86;--line:#c9d4e3;--hl:#ffe36e;--accent:#2f5fd0;--on:#fff;--ok:#1d7a46;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#101826;--card:#1a2638;--ink:#e8eefb;--sub:#9db0cf;--line:#32435f;--hl:#6b5a10;--accent:#7ea2ff;--on:#0d1a33;--ok:#6fd49b;--bad:#ff9a90}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;line-height:1.6;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:960px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:20px}
@media(min-width:800px){.two{grid-template-columns:1fr 1fr;align-items:start}}
.two{display:grid;gap:20px}
h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:1.9rem;margin:0}
h1 span{background:linear-gradient(transparent 55%,var(--hl) 55%)}
h2{margin:0}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px}
label{display:block;font-weight:700;margin:14px 0 6px}
.first{margin-top:0}
input[type=text],input[type=email],input[type=password],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.drop{display:flex;justify-content:center;border:2px dashed var(--line);border-radius:10px;padding:16px;cursor:pointer;color:var(--sub);text-align:center;font-weight:400;margin:0}
.hide{position:absolute;opacity:0;width:1px;height:1px}
.count{font-size:.8rem;color:var(--sub);text-align:right}
.btns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
button{font:inherit;font-weight:700;border-radius:8px;padding:10px 16px;cursor:pointer;border:1.5px solid var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:var(--accent);color:var(--on)}
.ghost{background:transparent;color:var(--accent)}
.msg{min-height:1.5em;color:var(--sub);margin:10px 0 0}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.photo{aspect-ratio:4/3;border-radius:10px;background:var(--bg);border:1.5px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:.9rem}
.photo img{width:100%;height:100%;object-fit:cover}
.meta{margin:14px 0 4px;color:var(--sub)}
.title{font-family:"Noto Serif TC",serif;font-weight:900;font-size:1.4rem;margin:2px 0 8px;overflow-wrap:anywhere}
.desc{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.empty{color:var(--sub)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.item{border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--card)}
.item .meta{margin:10px 0 2px}.item .title{font-size:1.1rem}
.item button{margin-top:10px;padding:6px 12px;font-size:.85rem}
</style>
</head>
<body>
<main>
<h1><span>管理頁</span></h1>
<section class="panel" id="login" style="max-width:420px">
  <label class="first" for="em">Email</label>
  <input type="email" id="em" autocomplete="username">
  <label for="pw">密碼</label>
  <input type="password" id="pw" autocomplete="current-password">
  <div class="btns"><button class="primary" id="go">登入</button></div>
  <p class="msg" id="lmsg" role="status"></p>
</section>
<section id="board" style="display:none">
  <div class="btns" style="margin:0 0 14px;align-items:center"><h2>已收到：<span id="cnt">0</span></h2><button class="primary" id="exp">匯出 Word</button><button class="ghost" id="refresh">重新整理</button><button class="ghost" id="out">登出</button></div>
  <p class="msg" id="bmsg"></p>
  <div class="grid" id="list"></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script>
var SUPABASE_URL='https://aomiugvdrgmlafdfgfgh.supabase.co';
var rows=[];
var SUPABASE_KEY='sb_publishable_wXvz2GV4vdgfzV_3n60jwA_8gKnTExR';
var sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
var $=function(i){return document.getElementById(i)};
function show(on){$('login').style.display=on?'none':'block';$('board').style.display=on?'block':'none'}
function card(d){
  var el=document.createElement('div');el.className='item';
  var p=document.createElement('div');p.className='photo';
  if(d.photo_path){var i=document.createElement('img');i.loading='lazy';i.alt='課程照片';i.src=sb.storage.from('photos').getPublicUrl(d.photo_path).data.publicUrl;p.appendChild(i)}else{p.textContent='沒有照片'}
  var m=document.createElement('p');m.className='meta';m.textContent=d.class_name+'　'+d.student_name;
  var t=document.createElement('h3');t.className='title';t.textContent=d.course_name;
  var s=document.createElement('p');s.className='desc';s.textContent=d.description||'';
  var b=document.createElement('button');b.className='ghost';b.textContent='刪除';
  b.addEventListener('click',async function(){
    if(!confirm('確定刪除「'+d.student_name+'」的填寫？'))return;
    var r=await sb.from('submissions').delete().eq('id',d.id);
    if(r.error){$('bmsg').textContent='刪除失敗。';return}
    if(d.photo_path)await sb.storage.from('photos').remove([d.photo_path]);
    load();
  });
  [p,m,t,s,b].forEach(function(x){el.appendChild(x)});return el;
}
async function load(){
  $('bmsg').textContent='讀取中…';
  var r=await sb.from('submissions').select('*').order('created_at',{ascending:false});
  if(r.error){$('bmsg').textContent='讀取失敗：請確認登入的 Email 與 SQL 裡設定的相同。';return}
  rows=r.data;var l=$('list');l.textContent='';r.data.forEach(function(d){l.appendChild(card(d))});
  $('cnt').textContent=r.data.length;$('bmsg').textContent=r.data.length?'':'還沒有人送出。';
}
$('go').addEventListener('click',async function(){
  $('lmsg').className='msg';$('lmsg').textContent='登入中…';
  var r=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  if(r.error){$('lmsg').className='msg bad';$('lmsg').textContent='登入失敗，請檢查 Email 和密碼。';return}
  $('lmsg').textContent='';show(true);load();
});
$('out').addEventListener('click',async function(){await sb.auth.signOut();show(false)});

function imgSize(buf){return new Promise(function(res,rej){var u=URL.createObjectURL(new Blob([buf]));var im=new Image();im.onload=function(){URL.revokeObjectURL(u);res({w:im.naturalWidth,h:im.naturalHeight})};im.onerror=rej;im.src=u})}
async function exportWord(){
  var btn=$('exp');
  if(!rows.length){$('bmsg').textContent='目前沒有資料可匯出。';return}
  btn.disabled=true;$('bmsg').textContent='製作 Word 中，照片多時需要一些時間…';
  try{
    var D=docx,F='Microsoft JhengHei',kids=[],list=rows.slice().reverse();
    for(var i=0;i<list.length;i++){
      var d=list[i];
      kids.push(new D.Paragraph({pageBreakBefore:i>0,spacing:{after:120},children:[new D.TextRun({text:d.course_name,bold:true,size:40,font:F})]}));
      kids.push(new D.Paragraph({spacing:{after:240},children:[new D.TextRun({text:'班級：'+d.class_name+'　　姓名：'+d.student_name,size:26,font:F,color:'555555'})]}));
      if(d.photo_path){
        try{
          var url=sb.storage.from('photos').getPublicUrl(d.photo_path).data.publicUrl;
          var buf=await (await fetch(url)).arrayBuffer();
          var dm=await imgSize(buf),k=Math.min(1,480/dm.w,340/dm.h);
          kids.push(new D.Paragraph({spacing:{after:240},children:[new D.ImageRun({data:buf,type:'jpg',transformation:{width:Math.round(dm.w*k),height:Math.round(dm.h*k)}})]}));
        }catch(e){kids.push(new D.Paragraph({children:[new D.TextRun({text:'（照片無法載入）',font:F,color:'999999'})]}))}
      }
      (d.description||'').split('\n').forEach(function(line){
        kids.push(new D.Paragraph({spacing:{after:120,line:360},children:[new D.TextRun({text:line,size:26,font:F})]}));
      });
    }
    var doc=new D.Document({sections:[{properties:{page:{size:{width:11906,height:16838},margin:{top:1134,bottom:1134,left:1134,right:1134}}},children:kids}]});
    var blob=await D.Packer.toBlob(doc);
    var t=new Date(),pad=function(n){return String(n).padStart(2,'0')};
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='課程資料_'+t.getFullYear()+pad(t.getMonth()+1)+pad(t.getDate())+'.docx';
    document.body.appendChild(a);a.click();a.remove();
    $('bmsg').textContent='已匯出 '+rows.length+' 筆。';
  }catch(e){console.error(e);$('bmsg').textContent='匯出失敗，請稍後再試。'}
  btn.disabled=false;
}
$('exp').addEventListener('click',exportWord);
$('refresh').addEventListener('click',load);
sb.auth.getSession().then(function(r){if(r.data&&r.data.session){show(true);load()}});
</script>
</body>
</html>
