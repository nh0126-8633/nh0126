<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>BG 益智遊戲教室 學習單</title>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#4a3b52;--sub:#8a7a92;--pink:#d6457a;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light}
body{margin:0;background:#fff;color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;line-height:1.65}
main{max-width:640px;margin:0 auto;padding:22px 16px 48px}
.head{text-align:center;margin-bottom:18px}.head .mascot{font-size:2.4rem;line-height:1}
h1{font-family:"Huninn","Noto Sans TC",sans-serif;font-weight:400;font-size:1.7rem;margin:6px 0 4px;color:var(--pink)}
.head p{margin:0;color:var(--sub);font-size:.95rem}
.card{border:2.5px solid var(--c);background:#fff;border-radius:22px;padding:16px 16px 18px;margin:30px 0 16px;box-shadow:0 4px 0 var(--c)}
.card h2{display:inline-flex;align-items:center;gap:8px;font-family:"Huninn","Noto Sans TC",sans-serif;font-weight:400;font-size:1.15rem;margin:-31px 0 10px;background:var(--bg);border:2.5px solid var(--c);border-radius:99px;padding:3px 14px}
.hint{margin:0 0 8px;color:var(--sub);font-size:.92rem}
label.l{display:block;font-weight:700;margin:12px 0 6px}.first{margin-top:0!important}
input[type=text],input[type=date],textarea,select{width:100%;font:inherit;color:var(--ink);background:#fff;border:2.5px solid #ffe0ea;border-radius:16px;padding:11px 14px}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--pink) 50%),linear-gradient(135deg,var(--pink) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible,.drop:focus-within{outline:3px solid #ffb3cf;outline-offset:1px;border-color:var(--pink)}
.err{border-color:var(--bad)!important;background-color:#fff6f5}
.count{font-size:.8rem;color:var(--sub);text-align:right}
.thumbs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.th{position:relative;border-radius:14px;overflow:hidden;border:2.5px solid #d8c6ff}
.th img{display:block;width:100%;height:120px;object-fit:cover}
.th button{position:absolute;top:6px;right:6px;border:0;border-radius:99px;background:#fff;color:var(--pink);font-weight:700;width:30px;height:30px;cursor:pointer}
.drop{display:flex;justify-content:center;border:2.5px dashed #b9dcff;border-radius:16px;padding:18px;cursor:pointer;color:var(--sub);text-align:center;background:#fff}
.hide{position:absolute;opacity:0;width:1px;height:1px}
.photo{margin-top:12px;border-radius:16px;overflow:hidden;border:2.5px solid #b9dcff;display:none}
.photo img{display:block;width:100%;max-height:300px;object-fit:cover}
.btn{display:block;width:100%;font:inherit;font-family:"Huninn","Noto Sans TC",sans-serif;font-size:1.2rem;border-radius:99px;padding:14px;margin-top:16px;cursor:pointer}
.send{color:#fff;background:var(--pink);border:0;box-shadow:0 5px 0 #a82d5a;margin-top:22px}
.send:active{transform:translateY(3px);box-shadow:0 2px 0 #a82d5a}
.prt{color:var(--pink);background:#fff;border:2.5px solid var(--pink)}
.btn:disabled{opacity:.6}
.msg{min-height:1.6em;text-align:center;color:var(--sub);margin:12px 0 0}.msg.bad{color:var(--bad);font-weight:700}
.done{text-align:center;padding:30px 12px}.done .big{font-size:3rem}
#printArea{display:none}
@media print{
  @page{size:A4;margin:10mm}
  html,body{background:#fff!important}
  #app{display:none!important}
  #printArea{display:block}
}

.sheet{width:190mm;height:274mm;margin:0 auto;display:flex;flex-direction:column;background:#fff;color:#44585a;font-family:"Huninn","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact;position:relative;overflow:hidden;text-align:left}
.sheet *{box-sizing:border-box}
.sh-top{height:32mm;margin:0 10mm;background:#d9d9d9;border-radius:0 0 50% 50%/0 0 70% 70%;display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.sh-title{font-size:24pt;font-weight:700;color:#44585a;letter-spacing:1mm;white-space:nowrap}
.sh-title b{font-size:32pt;margin-right:3mm}
.sh-deco{position:absolute;font-size:22pt;top:6mm}.sh-deco.l{left:8mm}.sh-deco.r{right:8mm}
.sh-row{display:flex;gap:6mm;margin:5mm 10mm 0;height:74mm;flex:none}
.sh-panel{background:#d9d9d9;border-radius:9mm;padding:4mm;display:flex;flex-direction:column;flex:1;min-width:0}
.sh-ptitle{text-align:center;font-weight:700;font-size:17pt;margin:1mm 0 3mm;overflow-wrap:anywhere;line-height:1.25}
.sh-photo{flex:1;min-height:0;background:#fff;border-radius:7mm;overflow:hidden;display:flex;align-items:center;justify-content:center}
.sh-photo img{width:100%;height:100%;object-fit:contain}
.sh-name{font-weight:700;font-size:17pt;margin:1mm 0 3mm;padding-left:6mm;overflow-wrap:anywhere;line-height:1.25}
.sh-grid{flex:1;min-height:0;background:#fff;border-radius:7mm;padding:3mm;display:grid;grid-template-columns:1fr 1fr;gap:3mm}
.sh-cell{background:#d9d9d9;border-radius:6mm;padding:1.5mm;text-align:center;display:flex;flex-direction:column;justify-content:center}
.sh-cl{font-weight:700;font-size:11pt;line-height:1.2}
.sh-star{color:#f3b22b;font-size:16pt;line-height:1.05;letter-spacing:.5mm}
.sh-acts{flex:1;min-height:0;margin:5mm 10mm 0;background:#d9d9d9;border-radius:9mm;padding:5mm;display:grid;gap:4mm;grid-template-columns:1fr 1fr;grid-auto-rows:1fr}
.sh-acts.n0,.sh-acts.n1{grid-template-columns:1fr}
.sh-acts.n2{grid-template-rows:1fr}
.sh-acts.n3 .sh-ac:first-child{grid-column:1/3}
.sh-ac{min-height:0;min-width:0;overflow:hidden;border-radius:5mm;display:flex;align-items:center;justify-content:center}
.sh-ac img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.sh-foot{flex:none;margin-top:5mm;background:#d9d9d9;padding:4mm 6mm;font-size:11.5pt;font-weight:700}
.sh-irow{display:flex;align-items:center;margin:1.2mm 0}
.sh-il{flex:1;text-align:right;padding-right:6mm}
.sh-io{width:22mm;text-align:center;padding:.6mm 0;border:.5mm solid transparent;border-radius:99px}
.sh-io.on{background:#fff;border-color:#44585a}
.sh-date{display:flex;margin-top:2.5mm}.sh-date span{flex:1;text-align:center}

</style>
</head>
<body>
<main id="app">
<div class="head"><div class="mascot" aria-hidden="true">🎲</div><h1>BG 益智遊戲教室 學習單</h1><p>請由上往下填寫，選擇孩子的表現，最後可以送出或直接列印</p></div>

<section class="card" style="--c:#bfe9d6;--bg:#dff6ec">
  <h2><span aria-hidden="true">🐸</span>課程資料</h2>
  <label class="l first" for="game">課程名稱</label>
  <input type="text" id="game" maxlength="60" placeholder="例如：青蛙跳下水" autocomplete="off">
  <label class="l">課程照片（選填）</label>
  <label class="drop" for="pic"><span id="dropText">點這裡選擇或拍攝照片</span></label>
  <input type="file" id="pic" class="hide" accept="image/*">
  <div class="photo" id="photo"></div>
</section>

<section class="card" style="--c:#ffd3e2;--bg:#ffe3ee">
  <h2><span aria-hidden="true">🧒</span>孩子姓名</h2>
  <input type="text" id="student" maxlength="40" autocomplete="off">
</section>

<section class="card" style="--c:#ffe29a;--bg:#fff3cf">
  <h2><span aria-hidden="true">⭐</span>能力星星</h2>
  <p class="hint">請為孩子的四項能力選擇星星數。</p>
  <label class="l first" for="s_focus">專注力</label><select id="s_focus"><option value="">請選擇</option><option value="1">⭐ 1 顆星</option><option value="2">⭐⭐ 2 顆星</option><option value="3">⭐⭐⭐ 3 顆星</option><option value="4">⭐⭐⭐⭐ 4 顆星</option></select>
  <label class="l" for="s_reaction">反應能力</label><select id="s_reaction"><option value="">請選擇</option><option value="1">⭐ 1 顆星</option><option value="2">⭐⭐ 2 顆星</option><option value="3">⭐⭐⭐ 3 顆星</option><option value="4">⭐⭐⭐⭐ 4 顆星</option></select>
  <label class="l" for="s_memory">記憶力</label><select id="s_memory"><option value="">請選擇</option><option value="1">⭐ 1 顆星</option><option value="2">⭐⭐ 2 顆星</option><option value="3">⭐⭐⭐ 3 顆星</option><option value="4">⭐⭐⭐⭐ 4 顆星</option></select>
  <label class="l" for="s_logic">邏輯思考</label><select id="s_logic"><option value="">請選擇</option><option value="1">⭐ 1 顆星</option><option value="2">⭐⭐ 2 顆星</option><option value="3">⭐⭐⭐ 3 顆星</option><option value="4">⭐⭐⭐⭐ 4 顆星</option></select>
</section>

<section class="card" style="--c:#b9dcff;--bg:#e3f1ff">
  <h2><span aria-hidden="true">😊</span>遊戲表現</h2>
  <p class="hint">請選擇孩子在每一項的表現。</p>
  <label class="l first" for="i_focus">專注地玩遊戲</label><select id="i_focus"><option value="">請選擇</option><option>好棒</option><option>很好</option><option>加油中</option></select>
  <label class="l" for="i_tolerance">培養遊戲的挫折容忍度</label><select id="i_tolerance"><option value="">請選擇</option><option>好棒</option><option>很好</option><option>加油中</option></select>
  <label class="l" for="i_cleanup">遊戲完成時能主動收拾</label><select id="i_cleanup"><option value="">請選擇</option><option>好棒</option><option>很好</option><option>加油中</option></select>
  <label class="l" for="i_rules">理解遊戲的玩法與遵守遊戲規則</label><select id="i_rules"><option value="">請選擇</option><option>好棒</option><option>很好</option><option>加油中</option></select>
</section>

<section class="card" style="--c:#d8c6ff;--bg:#efe6ff">
  <h2><span aria-hidden="true">📷</span>孩子操作照片</h2>
  <p class="hint">請放孩子上課操作的照片，1～4 張，會顯示在學習單中間的大格子。</p>
  <label class="drop" for="act" id="actDrop"><span id="actText">點這裡選擇或拍攝照片</span></label>
  <input type="file" id="act" class="hide" accept="image/*" multiple>
  <div class="thumbs" id="thumbs"></div>
</section>

<section class="card" style="--c:#ffd3e2;--bg:#ffe3ee">
  <h2><span aria-hidden="true">📅</span>操作日期</h2>
  <input type="date" id="date">
</section>

<button class="btn send" id="send">送出 🌈</button>
<button class="btn prt" id="prt">列印學習單 🖨️</button>
<p class="msg" id="msg" role="status"></p>
</main>
<div id="printArea" aria-hidden="true"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var SUPABASE_URL='https://aomiugvdrgmlafdfgfgh.supabase.co';
var SUPABASE_KEY='sb_publishable_wXvz2GV4vdgfzV_3n60jwA_8gKnTExR';
var sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
var $=function(i){return document.getElementById(i)};

function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
var SH_STARS={focus:['專注力','star_focus'],reaction:['反應能力','star_reaction'],memory:['記憶力','star_memory'],logic:['邏輯思考','star_logic']};
var SH_IND=[['ind_focus','專注地玩遊戲：'],['ind_tolerance','培養遊戲的挫折容忍度：'],['ind_cleanup','遊戲完成時能主動收拾：'],['ind_rules','理解遊戲的玩法與遵守遊戲規則：']];
var SH_OPT=['好棒','很好','加油中'];
function starRows(n){return ({1:[1],2:[2],3:[1,2],4:[2,2]})[n]||[]}
function renderSheet(d,photoSrc,actSrcs){
  var s=el('div','sheet');
  var top=el('div','sh-top');top.appendChild(el('span','sh-deco l','🎲'));
  var ti=el('div','sh-title');ti.appendChild(el('b','','BG'));ti.appendChild(document.createTextNode('益智遊戲教室'));top.appendChild(ti);
  top.appendChild(el('span','sh-deco r','🧩'));s.appendChild(top);
  var row=el('div','sh-row');
  var left=el('div','sh-panel');left.appendChild(el('div','sh-ptitle',d.game_name||''));
  var ph=el('div','sh-photo');if(photoSrc){var im=document.createElement('img');im.alt='課程照片';im.src=photoSrc;ph.appendChild(im)}left.appendChild(ph);
  var right=el('div','sh-panel');right.appendChild(el('div','sh-name','姓名：'+(d.student_name||'')));
  var grid=el('div','sh-grid');
  Object.keys(SH_STARS).forEach(function(k){
    var c=el('div','sh-cell');c.appendChild(el('div','sh-cl',SH_STARS[k][0]));
    var sw=el('div','');starRows(+d[SH_STARS[k][1]]).forEach(function(n){sw.appendChild(el('div','sh-star',new Array(n+1).join('★')))});
    c.appendChild(sw);grid.appendChild(c);
  });
  right.appendChild(grid);row.appendChild(left);row.appendChild(right);s.appendChild(row);
  var list=(actSrcs||[]).slice(0,4);
  var acts=el('div','sh-acts n'+list.length);
  list.forEach(function(u){var w=el('div','sh-ac');var i2=document.createElement('img');i2.alt='孩子操作照片';i2.src=u;w.appendChild(i2);acts.appendChild(w)});
  s.appendChild(acts);
  var foot=el('div','sh-foot');
  SH_IND.forEach(function(x){
    var r=el('div','sh-irow');r.appendChild(el('span','sh-il',x[1]));
    SH_OPT.forEach(function(o){r.appendChild(el('span','sh-io'+(d[x[0]]===o?' on':''),o))});
    foot.appendChild(r);
  });
  var dt=el('div','sh-date');dt.appendChild(el('span','','操作日期：'+(d.play_date||'').replace(/-/g,'/')));dt.appendChild(el('span','','家長簽名：'));foot.appendChild(dt);
  s.appendChild(foot);
  return s;
}

var msg=$('msg'),blob=null,previewUrl='',last=null,acts=[];
var F={game:$('game'),student:$('student'),s_focus:$('s_focus'),s_reaction:$('s_reaction'),s_memory:$('s_memory'),s_logic:$('s_logic'),i_focus:$('i_focus'),i_tolerance:$('i_tolerance'),i_cleanup:$('i_cleanup'),i_rules:$('i_rules'),date:$('date')};
var ORDER=[['game','課程名稱'],['student','孩子姓名'],['s_focus','專注力星星'],['s_reaction','反應能力星星'],['s_memory','記憶力星星'],['s_logic','邏輯思考星星'],['i_focus','專注地玩遊戲'],['i_tolerance','培養遊戲的挫折容忍度'],['i_cleanup','遊戲完成時能主動收拾'],['i_rules','理解遊戲的玩法與遵守遊戲規則'],['date','操作日期']];
(function(){var t=new Date(),p=function(n){return String(n).padStart(2,'0')};F.date.value=t.getFullYear()+'-'+p(t.getMonth()+1)+'-'+p(t.getDate())})();
function say(t,k){msg.textContent=t;msg.className='msg'+(k?' '+k:'')}
function val(k){return F[k].value.trim()}
Object.keys(F).forEach(function(k){F[k].addEventListener('input',function(){F[k].classList.remove('err')});F[k].addEventListener('change',function(){F[k].classList.remove('err')})});
$('pic').addEventListener('change',function(){
  var file=this.files&&this.files[0];if(!file)return;
  var url=URL.createObjectURL(file),im=new Image();
  im.onload=function(){
    var s=Math.min(1,1200/Math.max(im.width,im.height));
    var c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    c.toBlob(function(b){
      blob=b;previewUrl=c.toDataURL('image/jpeg',0.85);$('dropText').textContent='已選擇：'+file.name+'（點擊可更換）';
      var p=$('photo');p.style.display='block';p.textContent='';var i=document.createElement('img');i.alt='預覽';i.src=previewUrl;p.appendChild(i);
    },'image/jpeg',0.82);
    URL.revokeObjectURL(url);
  };
  im.onerror=function(){say('這張照片無法讀取，請換一張。','bad')};
  im.src=url;
});
function shrink(file){return new Promise(function(res,rej){var url=URL.createObjectURL(file),im=new Image();im.onload=function(){var s=Math.min(1,1200/Math.max(im.width,im.height));var c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(function(b){URL.revokeObjectURL(url);res({blob:b,url:URL.createObjectURL(b)})},'image/jpeg',0.82)};im.onerror=function(){URL.revokeObjectURL(url);rej()};im.src=url})}
function renderThumbs(){
  var t=$('thumbs');t.textContent='';
  acts.forEach(function(a,i){var w=el('div','th');var im=document.createElement('img');im.alt='操作照片';im.src=a.url;var x=el('button','','✕');x.type='button';x.setAttribute('aria-label','移除這張照片');x.addEventListener('click',function(){acts.splice(i,1);renderThumbs()});w.appendChild(im);w.appendChild(x);t.appendChild(w)});
  $('actText').textContent=acts.length?'已放 '+acts.length+' 張（最多 4 張，點這裡再新增）':'點這裡選擇或拍攝照片';
}
$('act').addEventListener('change',async function(){
  var files=Array.prototype.slice.call(this.files||[]);this.value='';
  for(var i=0;i<files.length;i++){
    if(acts.length>=4){say('最多放 4 張照片。','bad');break}
    try{acts.push(await shrink(files[i]));say('')}catch(e){say('有一張照片無法讀取，已略過。','bad')}
  }
  renderThumbs();
});
function firstMissing(){for(var i=0;i<ORDER.length;i++){if(!val(ORDER[i][0]))return ORDER[i]}return null}
function check(){
  var m=firstMissing();
  if(m){var e=F[m[0]];e.classList.add('err');e.scrollIntoView({behavior:'smooth',block:'center'});e.focus({preventScroll:true});say('還有必填欄位沒填：「'+m[1]+'」','bad');return false}
  if(!acts.length){var dz=$('actDrop');dz.scrollIntoView({behavior:'smooth',block:'center'});say('請放至少 1 張孩子操作的照片。','bad');return false}
  return true;
}
function collect(){
  return {game_name:val('game'),student_name:val('student'),star_focus:+val('s_focus'),star_reaction:+val('s_reaction'),star_memory:+val('s_memory'),star_logic:+val('s_logic'),ind_focus:val('i_focus'),ind_tolerance:val('i_tolerance'),ind_cleanup:val('i_cleanup'),ind_rules:val('i_rules'),play_date:val('date')};
}
function printSheet(d,photo,actUrls){
  var a=$('printArea');a.textContent='';var sh=renderSheet(d,photo,actUrls);a.appendChild(sh);
  var go=function(){window.print()};
  var pend=Array.prototype.filter.call(sh.querySelectorAll('img'),function(i){return !i.complete});
  if(pend.length){var n=pend.length;pend.forEach(function(i){i.onload=i.onerror=function(){if(--n===0)go()}});setTimeout(go,4000)}else{setTimeout(go,50)}
}
window.addEventListener('afterprint',function(){$('printArea').textContent=''});
$('prt').addEventListener('click',function(){if(!check())return;say('');printSheet(collect(),previewUrl,acts.map(function(a){return a.url}))});
$('send').addEventListener('click',async function(){
  if(!check())return;
  $('send').disabled=true;say('送出中…');
  var stage='photo';
  try{
    var d=collect(),path=null;
    if(blob){
      path=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2))+'.jpg';
      var up=await sb.storage.from('worksheet-photos').upload(path,blob,{contentType:'image/jpeg'});
      if(up.error)throw up.error;
    }
    var apaths=[];
    for(var i=0;i<acts.length;i++){
      var ap=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2))+'.jpg';
      var u2=await sb.storage.from('worksheet-photos').upload(ap,acts[i].blob,{contentType:'image/jpeg'});
      if(u2.error)throw u2.error;
      apaths.push(ap);
    }
    stage='data';
    var row=Object.assign({},d,{photo_path:path,activity_photos:apaths});
    var r=await sb.from('worksheets').insert(row);
    if(r.error)throw r.error;
    last={d:d,photo:previewUrl,acts:acts.map(function(a){return a.url})};done();
  }catch(e){
    var m=(e&&(e.message||e.error_description||e.error))||String(e);
    if(e&&e.statusCode)m+='（代碼 '+e.statusCode+'）';
    if(e&&e.code)m+='（代碼 '+e.code+'）';
    say((stage==='photo'?'照片上傳失敗：':'資料寫入失敗：')+m,'bad');console.error(e);$('send').disabled=false;
  }
});
function done(){
  var a=$('app');a.textContent='';
  var d=el('div','done');d.appendChild(el('div','big','🌟'));d.appendChild(el('h1','','已送出'));d.appendChild(el('p','','學習單已送出，謝謝您。'));
  var b1=el('button','btn prt','列印學習單 🖨️');b1.addEventListener('click',function(){printSheet(last.d,last.photo,last.acts)});
  var b2=el('button','btn prt','再填一份');b2.addEventListener('click',function(){location.reload()});
  d.appendChild(b1);d.appendChild(b2);a.appendChild(d);window.scrollTo(0,0);
}
</script>
</body>
</html>
