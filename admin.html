<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>BG 益智遊戲教室 後台</title>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#fff7fa;--card:#fff;--ink:#4a3b52;--sub:#8a7a92;--line:#ffd3e2;--hl:#ffe3ee;--accent:#d6457a;--on:#fff;--ok:#1d7a46;--bad:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;line-height:1.6;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:960px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:20px}
@media(min-width:800px){.two{grid-template-columns:1fr 1fr;align-items:start}}
.two{display:grid;gap:20px}
h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:1.9rem;margin:0}
h1 span{background:linear-gradient(transparent 55%,var(--hl) 55%)}
h2{margin:0}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px}
label{display:block;font-weight:700;margin:14px 0 6px}
.first{margin-top:0}
input[type=text],input[type=email],input[type=password],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.drop{display:flex;justify-content:center;border:2px dashed var(--line);border-radius:10px;padding:16px;cursor:pointer;color:var(--sub);text-align:center;font-weight:400;margin:0}
.hide{position:absolute;opacity:0;width:1px;height:1px}
.count{font-size:.8rem;color:var(--sub);text-align:right}
.btns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
button{font:inherit;font-weight:700;border-radius:8px;padding:10px 16px;cursor:pointer;border:1.5px solid var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:var(--accent);color:var(--on)}
.ghost{background:transparent;color:var(--accent)}
.msg{min-height:1.5em;color:var(--sub);margin:10px 0 0}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.photo{aspect-ratio:4/3;border-radius:10px;background:var(--bg);border:1.5px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:.9rem}
.photo img{width:100%;height:100%;object-fit:cover}
.meta{margin:14px 0 4px;color:var(--sub)}
.title{font-family:"Noto Serif TC",serif;font-weight:900;font-size:1.4rem;margin:2px 0 8px;overflow-wrap:anywhere}
.desc{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.empty{color:var(--sub)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.item{border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--card)}
.item .meta{margin:10px 0 2px}.item .title{font-size:1.1rem}
.item button{margin-top:10px;padding:6px 12px;font-size:.85rem}
</style>
<style>

h1{font-family:"Huninn","Noto Sans TC",sans-serif;font-weight:400;color:var(--accent);text-align:center;font-size:1.8rem;line-height:1.3}

h2{font-family:"Huninn","Noto Sans TC",sans-serif;font-weight:400;color:var(--accent);font-size:1.25rem}

button{border-radius:99px;border:2.5px solid var(--accent);padding:9px 18px}

.item{border:2.5px solid #d8c6ff;border-radius:20px;box-shadow:0 3px 0 #d8c6ff;background:#fff}
.item .title{font-family:"Huninn","Noto Sans TC",sans-serif;font-weight:400;color:var(--accent)}

#cnt{background:#ffe3ee;border-radius:99px;padding:0 12px}
}

.ualert{border-radius:14px;padding:8px 12px;margin:8px 0 0;font-weight:700}.ualert.warn{background:#fff3d6;color:#9a5a00}.ualert.bad{background:#ffe1de;color:#b3261e}
.pk-day{font-family:"Huninn","Noto Sans TC",sans-serif;color:var(--accent);font-size:1.1rem;margin:16px 0 6px}
.pk-row{display:flex;align-items:center;gap:8px;border:2.5px solid #ffd3e2;border-radius:16px;padding:8px 12px;margin:6px 0;background:#fff}
.pk-row .t{font-weight:700;color:var(--accent);min-width:3.4em}
.pk-row .n{flex:1;overflow-wrap:anywhere}
.pk-row .w{color:var(--sub);font-size:.88rem}
.pk-row button{padding:3px 10px;font-size:.8rem;border-width:2px}
.pk-bar{display:flex;align-items:center;gap:8px;margin:4px 0}
.pk-bar .l{min-width:3.6em;font-size:.9rem;color:var(--sub)}
.pk-bar .b{height:14px;border-radius:99px;background:linear-gradient(90deg,#ffb3cf,#d6457a);min-width:6px}
.pk-bar .c{font-size:.88rem}
input[type=date]{font:inherit;color:var(--ink);background:#fff;border:2.5px solid #ffe0ea;border-radius:16px;padding:9px 10px;width:100%}
</style>
<style>
.tabs{display:flex;gap:8px;margin:0 0 14px}
.tab{background:transparent;color:var(--accent)}
.tab.on{background:var(--accent);color:var(--on)}
.field{margin:2px 0;font-size:.95rem;overflow-wrap:anywhere}
.field b{color:var(--sub);font-weight:700}
input[type=datetime-local]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px}
</style>
<style>
.item .pbtn{margin-right:8px}
#printArea{display:none}
@media print{
  @page{size:A4;margin:10mm}
  html,body{background:#fff!important;color:#000!important}
  main{display:none!important}
  #printArea{display:block}
  .prec{page-break-after:always;color:#000;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
  .prec:last-child{page-break-after:auto}
  .ptitle{text-align:center;font-size:20pt;margin:0 0 6mm;font-weight:400;font-family:inherit;color:#000}
  .pline{display:flex;justify-content:space-between;font-size:10.5pt;margin-bottom:2mm}
  table.pt{width:100%;border-collapse:collapse;table-layout:fixed;font-size:10.5pt}
  .pt th,.pt td{border:1px solid #000;padding:2mm 2.5mm;text-align:left;vertical-align:middle;overflow-wrap:anywhere}
  .pt th{background:#d9d9d9!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pt td.pbody{height:40mm;vertical-align:top;white-space:pre-wrap}
  .psign{display:flex;justify-content:space-between;margin-top:6mm;font-size:10.5pt;font-weight:700}
  .prec img{display:block;max-width:100%;max-height:200mm;object-fit:contain;margin:4mm auto}
  .pdesc{white-space:pre-wrap;font-size:12pt;line-height:1.7}
  .pmeta{font-size:12pt;color:#444;margin:0 0 4mm}
}

.prec.sheetimg{page-break-inside:avoid;margin:0;padding:0}
.prec.sheetimg img{display:block;width:210mm;height:296mm;max-width:none;max-height:none;margin:0}
</style>
</head>
<body>
<main>
<div class="mascot">🧸</div>
<h1><span>BG 益智遊戲教室</span><small>後台管理頁</small></h1>
<p style="text-align:center;margin:-4px 0 8px"><a href="calendar.html" style="color:var(--accent);font-weight:700;text-decoration:none;border:2.5px solid #ffd3e2;border-radius:99px;padding:5px 16px;display:inline-block;box-shadow:0 3px 0 #ffd3e2">📅 我的行事曆</a></p>
<section class="panel" id="login" style="max-width:420px">
  <label class="first" for="em">Email</label>
  <input type="email" id="em" autocomplete="username">
  <label for="pw">密碼</label>
  <input type="password" id="pw" autocomplete="current-password">
  <div class="btns"><button class="primary" id="go">登入</button></div>
  <p class="msg" id="lmsg" role="status"></p>
</section>
<section id="board" style="display:none">
  <div class="panel" id="usage" style="margin:0 0 14px">
    <div style="display:flex;align-items:center;gap:8px"><b style="flex:1">📦 目前使用容量（免費版）</b><button class="ghost" id="usageRef" style="padding:3px 12px;font-size:.8rem;border-width:2px">更新</button></div>
    <div id="usageBody" class="hint" style="margin:8px 0 0;color:var(--sub)">讀取中…</div>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" id="tabI" role="tab">🩹 事故單</button>
    <button class="tab on" id="tabS" role="tab">📚 課程學習單</button>
    <button class="tab" id="tabP" role="tab">🚌 延托接送</button>
  </div>
  <details class="panel" style="margin:0 0 14px"><summary style="cursor:pointer;font-weight:700">設定老師通關密碼（給首頁使用）</summary>
    <p class="hint" style="margin:8px 0;color:var(--sub)">老師進入首頁要輸入這組密碼，才看得到班級和小朋友名單。至少 4 個字，可以隨時更換。</p>
    <input type="text" id="tcode" maxlength="40" placeholder="輸入新的老師通關密碼" autocomplete="off">
    <div class="btns"><button class="primary" id="tcodeGo">儲存密碼</button></div>
    <p class="msg" id="tcodeMsg" role="status"></p>
  </details>
  <details class="panel" style="margin:0 0 14px;border-color:#bfe9d6;box-shadow:0 4px 0 #bfe9d6"><summary style="cursor:pointer;font-weight:700;color:#2f8a5f">🧹 清理舊資料（空間不夠時用）</summary>
    <p class="hint" style="margin:8px 0;color:var(--sub)">刪除超過指定時間的舊紀錄，照片也會一起從儲存空間移除。<b>刪除後無法復原，請先匯出 Word / Excel 備份。</b></p>
    <label class="first" for="clType">要清理哪一種</label>
    <select id="clType"><option value="sheet">課程學習單（含照片，最占空間）</option><option value="incident">事故單（含照片）</option><option value="course">課程資料卡（舊測試資料，已停用）</option><option value="pickup">延托接送（只有文字，幾乎不占空間）</option></select>
    <label for="clMonths">刪除多久以前的</label>
    <select id="clMonths"><option value="0">全部（現在以前的全部）</option><option value="12">12 個月以前</option><option value="6">6 個月以前</option><option value="3">3 個月以前</option><option value="1">1 個月以前</option></select>
    <div class="btns"><button class="ghost" id="clPrev">先看有多少筆</button><button class="primary" id="clGo" disabled>刪除這些資料</button></div>
    <p class="msg" id="clMsg" role="status"></p>
  </details>
  <div id="pickBoard" style="display:none">
    <div class="panel" style="margin:0 0 14px">
      <label class="first">查詢日期（從 ～ 到）</label>
      <div style="display:flex;gap:8px;align-items:center"><input type="date" id="pFrom"><span>～</span><input type="date" id="pTo"></div>
      <div class="btns" style="margin-top:10px"><button class="ghost" id="pToday">今天</button><button class="ghost" id="pWeek">本週</button><button class="ghost" id="pMonth">本月</button></div>
      <label for="pCls">班級</label><select id="pCls"><option value="">全部班級</option></select>
    </div>
    <div class="btns" style="margin:0 0 12px"><button class="primary" id="pExp">匯出 Word</button><button class="primary" id="pCsv">匯出 Excel</button><button class="primary" id="pPrt">列印</button><button class="ghost" id="pRef">重新整理</button></div>
    <p class="msg" id="pMsg" role="status"></p>
    <div class="panel" id="pSum" style="margin:0 0 14px"></div>
    <div id="pList"></div>
  </div>
  <div id="cfRow" style="display:none;margin:0 0 12px"><label class="first" for="cf">選擇班級（只看這個班的學習單，列印和匯出也只會包含這個班）</label><select id="cf"><option value="">全部班級</option></select></div>
  <div id="orgRow" style="display:none;margin:0 0 12px"><label class="first" for="org">幼兒園名稱（匯出事故紀錄表時顯示在表頭）</label><input type="text" id="org" maxlength="40" placeholder="例如：○○幼兒園"></div>
  <div class="btns" id="genRow" style="margin:0 0 14px;align-items:center"><h2>已收到：<span id="cnt">0</span></h2><button class="primary" id="exp">匯出 Word</button><button class="primary" id="prt">列印</button><button class="ghost" id="refresh">重新整理</button><button class="ghost" id="out">登出</button></div>
  <p class="msg" id="bmsg"></p>
  <div class="grid" id="list"></div>
</section>
</main>
<div id="printArea" aria-hidden="true"></div>

<script>
var SUPABASE_URL='https://aomiugvdrgmlafdfgfgh.supabase.co';
var SUPABASE_KEY='sb_publishable_wXvz2GV4vdgfzV_3n60jwA_8gKnTExR';
var sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
var $=function(i){return document.getElementById(i)};
var data={course:[],incident:[],sheet:[]},err={course:'',incident:'',sheet:''},tab='sheet';
function show(on){$('login').style.display=on?'none':'block';$('board').style.display=on?'block':'none'}
function fmt(t){return (t||'').replace('T',' ')}
function pubUrl(p){return sb.storage.from('photos').getPublicUrl(p).data.publicUrl}
async function signedUrl(p){var r=await sb.storage.from('incident-photos').createSignedUrl(p,3600);return r.data&&r.data.signedUrl}
function line(label,val){var d=document.createElement('p');d.className='field';var b=document.createElement('b');b.textContent=label+'：';d.appendChild(b);d.appendChild(document.createTextNode(val||''));return d}
function mkPhoto(){var p=document.createElement('div');p.className='photo';p.textContent='沒有照片';return p}
function putImg(p,src){p.textContent='';var i=document.createElement('img');i.loading='lazy';i.alt='照片';i.src=src;p.appendChild(i)}
function delBtn(label,fn){var b=document.createElement('button');b.className='ghost';b.textContent='刪除';b.addEventListener('click',async function(){if(!confirm('確定刪除「'+label+'」？'))return;try{await fn();await load()}catch(e){$('bmsg').textContent='刪除失敗。'}});return b}
function courseCard(d){
  var el=document.createElement('div');el.className='item';var p=mkPhoto();
  if(d.photo_path)putImg(p,pubUrl(d.photo_path));
  var m=document.createElement('p');m.className='meta';m.textContent=d.class_name+'　'+d.student_name;
  var t=document.createElement('h3');t.className='title';t.textContent=d.course_name;
  var s=document.createElement('p');s.className='desc';s.textContent=d.description||'';
  var b=delBtn(d.student_name,async function(){
    var r=await sb.from('submissions').delete().eq('id',d.id);if(r.error)throw r.error;
    if(d.photo_path)await sb.storage.from('photos').remove([d.photo_path]);
  });
  [p,m,t,s,printBtn(function(){printNow([d],'course')}),b].forEach(function(x){el.appendChild(x)});return el;
}
function incidentCard(d){
  var el=document.createElement('div');el.className='item';var p=mkPhoto();
  if(d.photo_path)signedUrl(d.photo_path).then(function(u){if(u)putImg(p,u)});
  var t=document.createElement('h3');t.className='title';t.textContent='事故｜'+d.class_name+' '+d.child_name;
  el.appendChild(p);el.appendChild(t);
  el.appendChild(line('發生日期',d.incident_date));
  el.appendChild(line('性別／年齡',d.gender+'／'+d.age));
  el.appendChild(line('帶班老師',d.teacher_name));
  el.appendChild(line('事故發生情形',d.situation));
  el.appendChild(line('處理情形',d.handling));
  el.appendChild(line('處理結果',d.result));
  el.appendChild(line('後期預防整改措施',d.prevention));
  el.appendChild(printBtn(function(){printNow([d],'incident')}));
  el.appendChild(delBtn(d.child_name,async function(){
    var r=await sb.from('incidents').delete().eq('id',d.id);if(r.error)throw r.error;
    if(d.photo_path)await sb.storage.from('incident-photos').remove([d.photo_path]);
  }));
  return el;
}

function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
var SH_STARS=[['專注力','star_focus'],['反應能力','star_reaction'],['記憶力','star_memory'],['邏輯思考','star_logic']];
var SH_IND=[['ind_focus','專注地玩遊戲：'],['ind_tolerance','培養遊戲的挫折容忍度：'],['ind_cleanup','遊戲完成時能主動收拾：'],['ind_rules','理解遊戲的玩法與遵守遊戲規則：']];
var SH_OPT=['好棒','很好','加油中'];
var SH_FONT='"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
function starRows(n){return ({1:[1],2:[2],3:[1,2],4:[2,2]})[n]||[]}
async function loadImg(u){
  if(!u)return null;
  try{
    var src=u;
    if(/^https?:/.test(u)){var r=await fetch(u);if(!r.ok)return null;src=URL.createObjectURL(await r.blob())}
    return await new Promise(function(res){var i=new Image();i.onload=function(){res(i)};i.onerror=function(){res(null)};i.src=src});
  }catch(e){return null}
}
async function sheetFonts(d){
  var t='名稱難易度創造力空間概念依照步驟自行完成BG益智遊戲教室姓名：專注力反應能力記憶力邏輯思考好棒很好加油中操作日期家長簽名／'+SH_IND.map(function(x){return x[1]}).join('')+(d.game_name||'')+(d.student_name||'')+(d.play_date||'');
  try{await Promise.all([document.fonts.load('400 40px Huninn',t),document.fonts.load('700 40px "Noto Sans TC"',t)])}catch(e){}
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function starPath(c,cx,cy,R){c.beginPath();for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,r=i%2?R*0.45:R;c.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a))}c.closePath()}
function drawContain(c,img,x,y,w,h,r){
  var s=Math.min(w/img.width,h/img.height),dw=img.width*s,dh=img.height*s,dx=x+(w-dw)/2,dy=y+(h-dh)/2;
  c.save();rr(c,dx,dy,dw,dh,r);c.clip();c.drawImage(img,dx,dy,dw,dh);c.restore();
}
function fitFont(c,txt,weight,sizePx,minPx,maxW){var s=sizePx;c.font=weight+' '+s+'px '+SH_FONT;while(c.measureText(txt).width>maxW&&s>minPx){s-=2;c.font=weight+' '+s+'px '+SH_FONT}}
function sheetFooter(c,M,T,rows,d,y0,step,dateY,sep){

      var files=[];r.data.forEach(function(d){clFiles(type,d).forEach(function(x){files.push(x)})});
      if(files.length&&CL[type].b){var rm=await sb.storage.from(CL[type].b).remove(files);if(rm.error)throw rm.error}
      var ids=r.data.map(function(d){return d.id});var dl2=await sb.from(CL[type].t).delete().in('id',ids);if(dl2.error)throw dl2.error;
      done+=ids.length;m.textContent='刪除中… 已處理 '+done+' 筆';
    }
    m.className='msg ok';m.textContent='完成，已刪除 '+done+' 筆。';
    await load();loadUsage();
  }catch(e){m.className='msg bad';m.textContent='刪除中斷（已刪 '+done+' 筆）：'+((e&&e.message)||e)}
  $('clPrev').disabled=false;
});
$('refresh').addEventListener('click',load);
sb.auth.getSession().then(function(r){if(r.data&&r.data.session){show(true);load()}});
</script>
